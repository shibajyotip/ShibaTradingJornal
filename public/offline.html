<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TradeLog — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090B0F;
      color: #F0F4FF;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 72px; height: 72px; border-radius: 36px;
      background: rgba(0,212,170,0.12);
      border: 2px solid rgba(0,212,170,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin: 0 auto 24px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    p  { font-size: 14px; color: #8B95A8; line-height: 1.6; max-width: 280px; margin-bottom: 28px; }
    .note {
      font-size: 12px; color: #4A5568;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 14px 18px;
      max-width: 300px; line-height: 1.6;
    }
    button {
      margin-top: 20px;
      padding: 14px 28px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #00D4AA, #00A88A);
      color: #000; font-size: 15px; font-weight: 700;
      cursor: pointer; width: 100%; max-width: 300px;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>You're Offline</h1>
  <p>No internet connection detected. Once you go online, TradeLog will load instantly from cache.</p>
  <div class="note">
    ✅ Your trade data is saved locally<br/>
    ✅ No data was lost<br/>
    ✅ App resumes where you left off
  </div>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
